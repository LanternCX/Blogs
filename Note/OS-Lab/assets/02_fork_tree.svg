<text x="135" y="370" class="t">第 2 次 fork</text>
<rect x="300" y="535" width="500" height="55" rx="12" class="gray"/>
<text x="550" y="569" text-anchor="middle" class="t">两次无条件 fork：每个现存进程继续执行，最终共有 4 个进程。</text>

