<rect x="90" y="420" width="160" height="72" rx="14" class="blue"/>
<text x="170" y="464" text-anchor="middle" class="h">P0</text>
<rect x="335" y="420" width="160" height="72" rx="14" class="green"/>
<text x="415" y="464" text-anchor="middle" class="h">P2</text>
<rect x="605" y="420" width="160" height="72" rx="14" class="green"/>
