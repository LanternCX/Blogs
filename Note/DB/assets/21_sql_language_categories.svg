<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="520" viewBox="0 0 1150 520"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#596579"/></marker></defs><style>
text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.t{font-size:16px}.s{font-size:14px}.mono{font-family:Menlo,Consolas,monospace;font-size:15px}
.box{fill:#f8fafc;stroke:#5b6b8c;stroke-width:2}.blue{fill:#e8f0ff;stroke:#4978c7;stroke-width:2}.green{fill:#e9f8ef;stroke:#3c8a5a;stroke-width:2}.orange{fill:#fff3e3;stroke:#c97820;stroke-width:2}.red{fill:#fff0f1;stroke:#c64b55;stroke-width:2}.purple{fill:#f3edff;stroke:#7855b5;stroke-width:2}.gray{fill:#eef1f5;stroke:#7b879a;stroke-width:2}
.line{stroke:#596579;stroke-width:2;fill:none}.arrow{stroke:#596579;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}.thin{stroke-width:1.5}
</style><rect width="100%" height="100%" fill="#ffffff"/>
<text x="575" y="45" text-anchor="middle" class="title">SQL 语言分类：看语句在改变什么</text>
<rect x="55" y="115" width="190" height="125" rx="16" class="blue"/><text x="150" y="153" text-anchor="middle" class="h">DDL</text><text x="150" y="185" text-anchor="middle" class="t">定义结构</text><text x="150" y="215" text-anchor="middle" class="mono">CREATE / ALTER</text>
<rect x="270" y="115" width="190" height="125" rx="16" class="green"/><text x="365" y="153" text-anchor="middle" class="h">DML</text><text x="365" y="185" text-anchor="middle" class="t">改变数据</text><text x="365" y="215" text-anchor="middle" class="mono">INSERT / UPDATE</text>
<rect x="485" y="115" width="190" height="125" rx="16" class="purple"/><text x="580" y="153" text-anchor="middle" class="h">DQL</text><text x="580" y="185" text-anchor="middle" class="t">读取数据</text><text x="580" y="215" text-anchor="middle" class="mono">SELECT</text>
<rect x="700" y="115" width="190" height="125" rx="16" class="orange"/><text x="795" y="153" text-anchor="middle" class="h">DCL</text><text x="795" y="185" text-anchor="middle" class="t">管理权限</text><text x="795" y="215" text-anchor="middle" class="mono">GRANT / REVOKE</text>
<rect x="915" y="115" width="190" height="125" rx="16" class="red"/><text x="1010" y="153" text-anchor="middle" class="h">TCL</text><text x="1010" y="185" text-anchor="middle" class="t">控制事务</text><text x="1010" y="215" text-anchor="middle" class="mono">COMMIT / ROLLBACK</text>
<rect x="225" y="345" width="700" height="75" rx="16" class="gray"/><text x="575" y="390" text-anchor="middle" class="t">分类题不要只背缩写，先判断语句作用于结构、数据、查询、权限还是事务。</text>
</svg>
