<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="530" viewBox="0 0 1150 530"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#596579"/></marker></defs><style>
text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.t{font-size:16px}.s{font-size:14px}.mono{font-family:Menlo,Consolas,monospace;font-size:15px}
.box{fill:#f8fafc;stroke:#5b6b8c;stroke-width:2}.blue{fill:#e8f0ff;stroke:#4978c7;stroke-width:2}.green{fill:#e9f8ef;stroke:#3c8a5a;stroke-width:2}.orange{fill:#fff3e3;stroke:#c97820;stroke-width:2}.red{fill:#fff0f1;stroke:#c64b55;stroke-width:2}.purple{fill:#f3edff;stroke:#7855b5;stroke-width:2}.gray{fill:#eef1f5;stroke:#7b879a;stroke-width:2}
.line{stroke:#596579;stroke-width:2;fill:none}.arrow{stroke:#596579;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}.thin{stroke-width:1.5}
</style><rect width="100%" height="100%" fill="#ffffff"/>
<text x="575" y="42" text-anchor="middle" class="title">关系代数：把查询拆成一串集合操作</text>
<rect x="40" y="120" width="180" height="90" rx="14" class="blue"/><text x="130" y="157" text-anchor="middle" class="h">原始关系</text><text x="130" y="187" text-anchor="middle" class="t">Sailors / Boats</text>
<rect x="290" y="120" width="180" height="90" rx="14" class="orange"/><text x="380" y="157" text-anchor="middle" class="h">选择 σ</text><text x="380" y="187" text-anchor="middle" class="t">筛选行</text>
<rect x="540" y="120" width="180" height="90" rx="14" class="purple"/><text x="630" y="157" text-anchor="middle" class="h">连接 ⋈</text><text x="630" y="187" text-anchor="middle" class="t">拼接相关元组</text>
<rect x="790" y="120" width="180" height="90" rx="14" class="green"/><text x="880" y="157" text-anchor="middle" class="h">投影 π</text><text x="880" y="187" text-anchor="middle" class="t">保留需要的列</text>
<path d="M220 165 H290" class="arrow"/><path d="M470 165 H540" class="arrow"/><path d="M720 165 H790" class="arrow"/>
<rect x="205" y="310" width="740" height="140" rx="16" class="gray"/><text x="575" y="350" text-anchor="middle" class="h">示例：查询订过红色船只的水手编号</text><text x="575" y="392" text-anchor="middle" class="mono">π_sid ( Reserves ⋈ σ_color='红色'(Boats) )</text><text x="575" y="424" text-anchor="middle" class="t">先选择红船，再连接预订记录，最后只保留 sid。</text>
