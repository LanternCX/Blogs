<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#596579"/></marker></defs><style>
text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.t{font-size:16px}.s{font-size:14px}.mono{font-family:Menlo,Consolas,monospace;font-size:15px}
.box{fill:#f8fafc;stroke:#5b6b8c;stroke-width:2}.blue{fill:#e8f0ff;stroke:#4978c7;stroke-width:2}.green{fill:#e9f8ef;stroke:#3c8a5a;stroke-width:2}.orange{fill:#fff3e3;stroke:#c97820;stroke-width:2}.red{fill:#fff0f1;stroke:#c64b55;stroke-width:2}.purple{fill:#f3edff;stroke:#7855b5;stroke-width:2}.gray{fill:#eef1f5;stroke:#7b879a;stroke-width:2}
.line{stroke:#596579;stroke-width:2;fill:none}.arrow{stroke:#596579;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}.thin{stroke-width:1.5}
</style><rect width="100%" height="100%" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">查询树优化：先缩小数据，再做昂贵连接</text>
<text x="270" y="85" text-anchor="middle" class="h">优化前</text><text x="930" y="85" text-anchor="middle" class="h">优化后</text>
<rect x="170" y="115" width="200" height="60" rx="10" class="green"/><text x="270" y="153" text-anchor="middle" class="mono">π dName,dPrice,rID,QTY</text>
<rect x="170" y="220" width="200" height="60" rx="10" class="orange"/><text x="270" y="258" text-anchor="middle" class="mono">σ dName LIKE '%花菜%'</text>
<rect x="170" y="325" width="200" height="60" rx="10" class="purple"/><text x="270" y="363" text-anchor="middle" class="h">⋈ dID</text>
<rect x="60" y="455" width="180" height="65" rx="10" class="blue"/><text x="150" y="495" text-anchor="middle" class="h">Dish</text><rect x="300" y="455" width="180" height="65" rx="10" class="blue"/><text x="390" y="495" text-anchor="middle" class="h">Sales</text>
<path d="M270 455 V385" class="line"/><path d="M390 455 C390 420 330 410 300 385" class="line"/><path d="M270 325 V280" class="arrow"/><path d="M270 220 V175" class="arrow"/>
<rect x="830" y="115" width="200" height="60" rx="10" class="green"/><text x="930" y="153" text-anchor="middle" class="mono">π dName,dPrice,rID,QTY</text>
<rect x="830" y="250" width="200" height="60" rx="10" class="purple"/><text x="930" y="288" text-anchor="middle" class="h">⋈ dID</text>
<rect x="700" y="385" width="250" height="75" rx="10" class="orange"/><text x="825" y="415" text-anchor="middle" class="mono">π dID,dName,dPrice</text><text x="825" y="442" text-anchor="middle" class="mono">σ dName LIKE '%花菜%'(Dish)</text>
<rect x="985" y="385" width="170" height="75" rx="10" class="blue"/><text x="1070" y="420" text-anchor="middle" class="mono">π dID,rID,QTY</text><text x="1070" y="446" text-anchor="middle" class="t">Sales</text>
<path d="M825 385 C825 345 885 330 900 310" class="line"/><path d="M1070 385 C1070 345 975 330 960 310" class="line"/><path d="M930 250 V175" class="arrow"/>
<text x="600" y="590" text-anchor="middle" class="t">选择下推减少行，投影下推减少列；连接顺序优先让中间结果尽可能小。</text>
