<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="560" viewBox="0 0 1150 560"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#596579"/></marker></defs><style>
text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.t{font-size:16px}.s{font-size:14px}.mono{font-family:Menlo,Consolas,monospace;font-size:15px}
.box{fill:#f8fafc;stroke:#5b6b8c;stroke-width:2}.blue{fill:#e8f0ff;stroke:#4978c7;stroke-width:2}.green{fill:#e9f8ef;stroke:#3c8a5a;stroke-width:2}.orange{fill:#fff3e3;stroke:#c97820;stroke-width:2}.red{fill:#fff0f1;stroke:#c64b55;stroke-width:2}.purple{fill:#f3edff;stroke:#7855b5;stroke-width:2}.gray{fill:#eef1f5;stroke:#7b879a;stroke-width:2}
.line{stroke:#596579;stroke-width:2;fill:none}.arrow{stroke:#596579;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}.thin{stroke-width:1.5}
</style><rect width="100%" height="100%" fill="#ffffff"/>
<text x="575" y="45" text-anchor="middle" class="title">MongoDB：嵌入还是引用</text>
<rect x="70" y="110" width="450" height="310" rx="16" class="green"/><text x="295" y="150" text-anchor="middle" class="h">适合嵌入</text><rect x="135" y="190" width="320" height="160" rx="12" class="box"/><text x="295" y="225" text-anchor="middle" class="mono">Order</text><text x="295" y="260" text-anchor="middle" class="t">items: [</text><text x="295" y="288" text-anchor="middle" class="s">少量订单明细，随订单一起读取</text><text x="295" y="316" text-anchor="middle" class="t">]</text><text x="295" y="385" text-anchor="middle" class="t">同生命周期、数量有界、整体读取</text>
<rect x="630" y="110" width="450" height="310" rx="16" class="blue"/><text x="855" y="150" text-anchor="middle" class="h">适合引用</text><rect x="690" y="195" width="150" height="95" rx="12" class="box"/><text x="765" y="250" text-anchor="middle" class="mono">Book</text><rect x="900" y="195" width="150" height="95" rx="12" class="box"/><text x="975" y="250" text-anchor="middle" class="mono">Author</text><path d="M840 242 H900" class="arrow"/><text x="870" y="225" text-anchor="middle" class="s">authorId</text><text x="855" y="385" text-anchor="middle" class="t">独立更新、被共享、数量可能增长</text>
<rect x="225" y="465" width="700" height="55" rx="14" class="gray"/><text x="575" y="500" text-anchor="middle" class="t">选择依据不是语法偏好，而是一致性边界、访问方式、共享程度和数量上限。</text>
</svg>
