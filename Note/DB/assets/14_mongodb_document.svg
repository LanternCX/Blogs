.box{fill:#f8fafc;stroke:#5b6b8c;stroke-width:2}.blue{fill:#e8f0ff;stroke:#4978c7;stroke-width:2}.green{fill:#e9f8ef;stroke:#3c8a5a;stroke-width:2}.orange{fill:#fff3e3;stroke:#c97820;stroke-width:2}.red{fill:#fff0f1;stroke:#c64b55;stroke-width:2}.purple{fill:#f3edff;stroke:#7855b5;stroke-width:2}.gray{fill:#eef1f5;stroke:#7b879a;stroke-width:2}
.line{stroke:#596579;stroke-width:2;fill:none}.arrow{stroke:#596579;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}.thin{stroke-width:1.5}
</style><rect width="100%" height="100%" fill="#ffffff"/>
<text x="550" y="42" text-anchor="middle" class="title">MongoDB：一个文档可以直接包含嵌套对象与数组</text>
<rect x="90" y="90" width="530" height="410" rx="18" class="green"/><text x="355" y="130" text-anchor="middle" class="h">products 文档</text>
<text x="135" y="180" class="mono">{</text><text x="165" y="215" class="mono">name: "机械键盘 K8",</text><text x="165" y="250" class="mono">category: "数码",</text><text x="165" y="285" class="mono">price: 599,</text><text x="165" y="320" class="mono">tags: ["键盘", "办公", "电竞"],</text><text x="165" y="355" class="mono">specs: {</text><text x="205" y="390" class="mono">weight: "800g", color: "黑色"</text><text x="165" y="425" class="mono">}</text><text x="135" y="460" class="mono">}</text>
