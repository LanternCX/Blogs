<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#596579"/></marker></defs><style>
text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.t{font-size:16px}.s{font-size:14px}.mono{font-family:Menlo,Consolas,monospace;font-size:15px}
.box{fill:#f8fafc;stroke:#5b6b8c;stroke-width:2}.blue{fill:#e8f0ff;stroke:#4978c7;stroke-width:2}.green{fill:#e9f8ef;stroke:#3c8a5a;stroke-width:2}.orange{fill:#fff3e3;stroke:#c97820;stroke-width:2}.red{fill:#fff0f1;stroke:#c64b55;stroke-width:2}.purple{fill:#f3edff;stroke:#7855b5;stroke-width:2}.gray{fill:#eef1f5;stroke:#7b879a;stroke-width:2}
.line{stroke:#596579;stroke-width:2;fill:none}.arrow{stroke:#596579;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}.thin{stroke-width:1.5}
</style><rect width="100%" height="100%" fill="#ffffff"/>
<text x="600" y="42" text-anchor="middle" class="title">B+ 树索引与 Hash 索引</text>
<rect x="50" y="90" width="530" height="470" rx="18" class="blue"/><text x="315" y="130" text-anchor="middle" class="h">B+ 树</text>
<rect x="225" y="165" width="180" height="55" rx="8" class="purple"/><text x="315" y="200" text-anchor="middle" class="mono">[30 | 60]</text>
<rect x="80" y="285" width="190" height="55" rx="8" class="green"/><text x="175" y="320" text-anchor="middle" class="mono">[10 20 25]</text><rect x="315" y="285" width="190" height="55" rx="8" class="green"/><text x="410" y="320" text-anchor="middle" class="mono">[30 40 50]</text>
<rect x="205" y="390" width="220" height="55" rx="8" class="green"/><text x="315" y="425" text-anchor="middle" class="mono">[60 70 80 90]</text>
<path d="M275 220 L175 285" class="line"/><path d="M315 220 L410 285" class="line"/><path d="M355 220 L315 390" class="line"/><path d="M270 312 H315" class="arrow"/><path d="M505 312 C545 312 545 417 425 417" class="arrow"/>
<text x="315" y="495" text-anchor="middle" class="t">有序；支持 =、范围、排序、前缀扫描</text><text x="315" y="525" text-anchor="middle" class="t">叶子节点按键值顺序相连</text>
<rect x="620" y="90" width="530" height="470" rx="18" class="orange"/><text x="885" y="130" text-anchor="middle" class="h">Hash</text>
<rect x="690" y="175" width="170" height="60" rx="10" class="purple"/><text x="775" y="212" text-anchor="middle" class="mono">hash(key)</text>
<rect x="935" y="155" width="150" height="55" rx="8" class="green"/><text x="1010" y="190" text-anchor="middle" class="mono">bucket 0</text><rect x="935" y="240" width="150" height="55" rx="8" class="green"/><text x="1010" y="275" text-anchor="middle" class="mono">bucket 1</text><rect x="935" y="325" width="150" height="55" rx="8" class="green"/><text x="1010" y="360" text-anchor="middle" class="mono">bucket 2</text>
<path d="M860 205 H935" class="arrow"/><path d="M860 205 C900 205 900 267 935 267" class="arrow"/><path d="M860 205 C900 205 900 352 935 352" class="arrow"/>
<text x="885" y="445" text-anchor="middle" class="t">等值查找很快；键之间没有顺序</text><text x="885" y="475" text-anchor="middle" class="t">不适合范围查询、排序与最左前缀</text><text x="885" y="520" text-anchor="middle" class="s">随机 token 精确匹配是典型 Hash 场景</text>
<text x="600" y="615" text-anchor="middle" class="t">索引选择不是“谁永远更快”，而是让索引结构匹配查询模式。</text>
</svg>