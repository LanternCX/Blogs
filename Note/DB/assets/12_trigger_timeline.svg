<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="520" viewBox="0 0 1150 520"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#596579"/></marker></defs><style>
text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}
.title{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.t{font-size:16px}.s{font-size:14px}.mono{font-family:Menlo,Consolas,monospace;font-size:15px}
.box{fill:#f8fafc;stroke:#5b6b8c;stroke-width:2}.blue{fill:#e8f0ff;stroke:#4978c7;stroke-width:2}.green{fill:#e9f8ef;stroke:#3c8a5a;stroke-width:2}.orange{fill:#fff3e3;stroke:#c97820;stroke-width:2}.red{fill:#fff0f1;stroke:#c64b55;stroke-width:2}.purple{fill:#f3edff;stroke:#7855b5;stroke-width:2}.gray{fill:#eef1f5;stroke:#7b879a;stroke-width:2}
.line{stroke:#596579;stroke-width:2;fill:none}.arrow{stroke:#596579;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}.thin{stroke-width:1.5}
</style><rect width="100%" height="100%" fill="#ffffff"/>
<text x="575" y="42" text-anchor="middle" class="title">触发器：某条数据变化前后自动执行</text>
<rect x="50" y="140" width="210" height="95" rx="14" class="blue"/><text x="155" y="178" text-anchor="middle" class="h">用户 SQL</text><text x="155" y="208" text-anchor="middle" class="mono">INSERT / UPDATE / DELETE</text>
<rect x="330" y="120" width="210" height="135" rx="14" class="orange"/><text x="435" y="160" text-anchor="middle" class="h">BEFORE</text><text x="435" y="192" text-anchor="middle" class="t">检查或修改 NEW</text><text x="435" y="220" text-anchor="middle" class="t">不合法时阻止操作</text>
<rect x="610" y="140" width="210" height="95" rx="14" class="purple"/><text x="715" y="178" text-anchor="middle" class="h">表数据变化</text><text x="715" y="208" text-anchor="middle" class="t">一行一行触发</text>
<rect x="890" y="120" width="210" height="135" rx="14" class="green"/><text x="995" y="160" text-anchor="middle" class="h">AFTER</text><text x="995" y="192" text-anchor="middle" class="t">写日志、维护统计</text><text x="995" y="220" text-anchor="middle" class="t">级联清理关联记录</text>
<path d="M260 188 H330" class="arrow"/><path d="M540 188 H610" class="arrow"/><path d="M820 188 H890" class="arrow"/>
<rect x="205" y="340" width="740" height="100" rx="14" class="gray"/><text x="575" y="378" text-anchor="middle" class="h">OLD 与 NEW</text><text x="575" y="413" text-anchor="middle" class="t">INSERT：只有 NEW　　DELETE：只有 OLD　　UPDATE：OLD 与 NEW 都有</text>
</svg>