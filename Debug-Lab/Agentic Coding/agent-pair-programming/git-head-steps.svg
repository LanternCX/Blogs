<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550" role="img"><title>Branch and HEAD movement</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="800" height="550" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" font-size="20" fill="#0f172a"><text x="30" y="35">1 · Create branch</text><circle cx="110" cy="100" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="110" y="107" text-anchor="middle">A</text><circle cx="260" cy="100" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="260" y="107" text-anchor="middle">B</text><path d="M236 100 L134 100" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="290" y="60" width="245" height="32" rx="6" fill="#ecfdf5"/><text x="300" y="83" font-size="17">HEAD → feat/student-name</text><rect x="290" y="105" width="245" height="32" rx="6" fill="#ecfdf5"/><text x="300" y="128" font-size="17">main → B</text><text x="30" y="210">2 · Commit on feature</text><circle cx="110" cy="275" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="110" y="282" text-anchor="middle">A</text><circle cx="260" cy="275" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="260" y="282" text-anchor="middle">B</text><path d="M236 275 L134 275" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><circle cx="410" cy="275" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="410" y="282" text-anchor="middle">C</text><path d="M386 275 L284 275" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="440" y="245" width="245" height="32" rx="6" fill="#ecfdf5"/><text x="450" y="268" font-size="17">HEAD → feat/student-name</text><rect x="160" y="315" width="245" height="32" rx="6" fill="#ecfdf5"/><text x="170" y="338" font-size="17">main → B</text><text x="30" y="400">3 · Switch to main</text><circle cx="110" cy="465" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="110" y="472" text-anchor="middle">A</text><circle cx="260" cy="465" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="260" y="472" text-anchor="middle">B</text><path d="M236 465 L134 465" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><circle cx="410" cy="465" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="410" y="472" text-anchor="middle">C</text><path d="M386 465 L284 465" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="180" y="500" width="245" height="32" rx="6" fill="#ecfdf5"/><text x="190" y="523" font-size="17">HEAD → main → B</text><rect x="440" y="430" width="245" height="32" rx="6" fill="#ecfdf5"/><text x="450" y="453" font-size="17">feat/student-name → C</text></g></svg>
