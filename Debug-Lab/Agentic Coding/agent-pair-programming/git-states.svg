<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="340" viewBox="0 0 1080 340" role="img" aria-labelledby="title desc">
<title id="title">Git states</title><desc id="desc">编辑产生工作区内容，add 将内容放进暂存区，commit 创建本地提交，push 将提交发送到远程；fetch 取得远程历史，pull 还会整合当前分支。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="1080" height="340" rx="16" fill="#f8fafc"/>
<g font-family="Inter, Arial, sans-serif" font-size="22" fill="#0f172a" text-anchor="middle"><rect x="25" y="90" width="200" height="80" rx="12" fill="#eff6ff" stroke="#cbd5e1"/><text x="125" y="137">Working tree</text><rect x="295" y="90" width="200" height="80" rx="12" fill="#eff6ff" stroke="#cbd5e1"/><text x="395" y="137">Stage</text><rect x="565" y="90" width="200" height="80" rx="12" fill="#eff6ff" stroke="#cbd5e1"/><text x="665" y="137">Local repo</text><rect x="835" y="90" width="200" height="80" rx="12" fill="#ecfdf5" stroke="#cbd5e1"/><text x="935" y="137">Remote</text><path d="M225 130 H295" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M495 130 H565" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M765 130 H835" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><g font-size="17" fill="#64748b"><text x="260" y="112">add</text><text x="530" y="112">commit</text><text x="800" y="112">push</text></g><path d="M935 170 V225 H665 V170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="800" y="213" font-size="18">fetch</text><path d="M935 225 V290 H125 V170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><text x="530" y="278" font-size="18">pull = fetch + integrate</text></g></svg>
