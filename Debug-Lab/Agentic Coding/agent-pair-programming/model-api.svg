<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Model API and local tools</title><desc id="desc">本地 Agent 发送上下文给模型，接收工具调用请求，在本地执行工具，再把结果发送给模型以继续生成。</desc>
