<rect x="710" y="70" width="165" height="55" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="792.5" y="104.5">Model</text>
<path d="M150 125 V510 M452 125 V510 M792 125 V510" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 6" fill="none"/><path d="M452 175 H792" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="622" y="163" font-size="18">Request</text><path d="M792 240 H452" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="622" y="228" font-size="18">Tool call</text><path d="M452 305 H150" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="301" y="293" font-size="18">Execute</text><path d="M150 370 H452" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<text x="301" y="358" font-size="18">Result</text><path d="M452 435 H792" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
