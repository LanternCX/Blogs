<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230" role="img"><title>Revert preserves history</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="800" height="230" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" font-size="20" fill="#0f172a"><text x="30" y="35">Revert C</text><circle cx="110" cy="110" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="110" y="117" text-anchor="middle">A</text><circle cx="260" cy="110" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="260" y="117" text-anchor="middle">B</text><path d="M236 110 L134 110" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><circle cx="410" cy="110" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="410" y="117" text-anchor="middle">C</text><path d="M386 110 L284 110" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><circle cx="560" cy="110" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="560" y="117" text-anchor="middle">R</text><path d="M536 110 L434 110" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="470" y="160" width="245" height="32" rx="6" fill="#ecfdf5"/><text x="480" y="183" font-size="17">HEAD → main → R</text><text x="30" y="210">R reverses C; C stays in history</text></g></svg>
