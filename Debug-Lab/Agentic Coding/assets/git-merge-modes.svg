<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img"><title>Fast-forward, merge, squash and rebase</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="800" height="720" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" font-size="20" fill="#0f172a"><text x="30" y="35">Fast-forward</text><circle cx="110" cy="95" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="110" y="102" text-anchor="middle">A</text><circle cx="260" cy="95" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="260" y="102" text-anchor="middle">B</text><path d="M236 95 L134 95" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><circle cx="410" cy="95" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="410" y="102" text-anchor="middle">C</text><path d="M386 95 L284 95" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="440" y="75" width="245" height="32" rx="6" fill="#ecfdf5"/><text x="450" y="98" font-size="17">main: B → C</text><text x="30" y="170">Merge commit</text><circle cx="110" cy="230" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="110" y="237" text-anchor="middle">A</text><circle cx="260" cy="230" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="260" y="237" text-anchor="middle">B</text><path d="M236 230 L134 230" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><circle cx="410" cy="230" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="410" y="237" text-anchor="middle">D</text><path d="M386 230 L284 230" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><circle cx="560" cy="230" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="560" y="237" text-anchor="middle">M</text><path d="M536 230 L434 230" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><circle cx="410" cy="290" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="410" y="297" text-anchor="middle">C</text><path d="M390 280 L280 240" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M543 240 L432 280" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="30" y="370">Squash · no parent link to C</text><circle cx="110" cy="425" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="110" y="432" text-anchor="middle">A</text><circle cx="260" cy="425" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="260" y="432" text-anchor="middle">B</text><path d="M236 425 L134 425" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><circle cx="410" cy="425" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="410" y="432" text-anchor="middle">D</text><path d="M386 425 L284 425" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><circle cx="560" cy="425" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="560" y="432" text-anchor="middle">S</text><path d="M536 425 L434 425" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="600" y="430">S = changes in C</text><text x="30" y="530">Rebase · replay C after D</text><circle cx="110" cy="590" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="110" y="597" text-anchor="middle">A</text><circle cx="260" cy="590" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="260" y="597" text-anchor="middle">B</text><path d="M236 590 L134 590" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><circle cx="410" cy="590" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="410" y="597" text-anchor="middle">D</text><path d="M386 590 L284 590" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><circle cx="560" cy="590" r="22" fill="#eff6ff" stroke="#94a3b8"/><text x="560" y="597" text-anchor="middle">C′</text><path d="M536 590 L434 590" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="30" y="670">C′ has a new parent and a new commit ID</text></g></svg>
