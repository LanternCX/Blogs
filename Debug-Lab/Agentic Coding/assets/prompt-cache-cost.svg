<svg xmlns="http://www.w3.org/2000/svg" width="800" height="435" viewBox="0 0 800 435" role="img"><title>Prompt cache and token costs</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="800" height="435" rx="16" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#0f172a" font-size="20"><text x="30" y="40" font-size="24">One request</text><rect x="30" y="75" width="350" height="75" rx="9" fill="#ecfdf5" stroke="#cbd5e1"/><text x="205" y="119.5" text-anchor="middle">20,000 cached input</text><rect x="420" y="75" width="350" height="75" rx="9" fill="#fff7ed" stroke="#cbd5e1"/><text x="595" y="119.5" text-anchor="middle">1,000 uncached input</text><text x="105" y="182" font-size="20">× cache-read rate</text><text x="485" y="182" font-size="20">× input rate</text><text x="390" y="185" font-size="24">+</text><path d="M400 210 V240" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="240" y="250" width="320" height="65" rx="9" fill="#eff6ff" stroke="#cbd5e1"/><text x="400" y="289.5" text-anchor="middle">Model generates 800 tokens</text><text x="260" y="345" font-size="22">+ 800 × output rate</text><text x="125" y="402" font-size="20">Total = cached input + uncached input + output</text></g></svg>
