<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">2024—2026 年全国大学生电子设计竞赛获奖统计</title>
  <desc id="desc">2024 年为省赛年，省一等奖 3 项、省二等奖 6 项；2025 年为国赛年，全国一等奖 1 项、省一等奖 1 项、省二等奖 4 项、省三等奖 2 项；2026 年为省赛年，省一等奖 2 项、省二等奖 1 项、省三等奖 1 项。</desc>
  <style>
    text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.head{font-size:18px;font-weight:700}.year{font-size:21px;font-weight:700}.yearNote{font-size:14px;fill:#596579}.value{font-size:26px;font-weight:700}.empty{font-size:22px;fill:#7b879a}.yearBox{fill:#f8fafc;stroke:#d8dee8;stroke-width:1.5}.blue{fill:#e8f0ff;stroke:#4978c7;stroke-width:2}.green{fill:#e9f8ef;stroke:#3c8a5a;stroke-width:2}.orange{fill:#fff3e3;stroke:#c97820;stroke-width:2}.gray{fill:#eef1f5;stroke:#7b879a;stroke-width:2}.zero{fill:#ffffff;stroke:#d8dee8;stroke-width:1.5}
  </style>
  <rect width="920" height="500" fill="#ffffff"/>
  <text x="460" y="48" text-anchor="middle" class="title">2024—2026 年电赛获奖</text>
  <rect x="70" y="85" width="150" height="65" rx="10" class="yearBox"/><text x="145" y="125" text-anchor="middle" class="head">年份</text>
  <rect x="230" y="85" width="145" height="65" rx="10" class="blue"/><text x="302.5" y="125" text-anchor="middle" class="head">国一等奖</text>
  <rect x="385" y="85" width="145" height="65" rx="10" class="green"/><text x="457.5" y="125" text-anchor="middle" class="head">省一等奖</text>
  <rect x="540" y="85" width="145" height="65" rx="10" class="orange"/><text x="612.5" y="125" text-anchor="middle" class="head">省二等奖</text>
  <rect x="695" y="85" width="145" height="65" rx="10" class="gray"/><text x="767.5" y="125" text-anchor="middle" class="head">省三等奖</text>
  <g><rect x="70" y="160" width="150" height="85" rx="10" class="yearBox"/><text x="145" y="199" text-anchor="middle" class="year">2024</text><text x="145" y="222" text-anchor="middle" class="yearNote">省赛年</text><rect x="230" y="160" width="145" height="85" rx="10" class="zero"/><text x="302.5" y="211" text-anchor="middle" class="empty">—</text><rect x="385" y="160" width="145" height="85" rx="10" class="green"/><text x="457.5" y="211" text-anchor="middle" class="value">3</text><rect x="540" y="160" width="145" height="85" rx="10" class="orange"/><text x="612.5" y="211" text-anchor="middle" class="value">6</text><rect x="695" y="160" width="145" height="85" rx="10" class="zero"/><text x="767.5" y="211" text-anchor="middle" class="empty">—</text></g>
  <g><rect x="70" y="255" width="150" height="85" rx="10" class="yearBox"/><text x="145" y="294" text-anchor="middle" class="year">2025</text><text x="145" y="317" text-anchor="middle" class="yearNote">国赛年</text><rect x="230" y="255" width="145" height="85" rx="10" class="blue"/><text x="302.5" y="306" text-anchor="middle" class="value">1</text><rect x="385" y="255" width="145" height="85" rx="10" class="green"/><text x="457.5" y="306" text-anchor="middle" class="value">1</text><rect x="540" y="255" width="145" height="85" rx="10" class="orange"/><text x="612.5" y="306" text-anchor="middle" class="value">4</text><rect x="695" y="255" width="145" height="85" rx="10" class="gray"/><text x="767.5" y="306" text-anchor="middle" class="value">2</text></g>
  <g><rect x="70" y="350" width="150" height="85" rx="10" class="yearBox"/><text x="145" y="389" text-anchor="middle" class="year">2026</text><text x="145" y="412" text-anchor="middle" class="yearNote">省赛年</text><rect x="230" y="350" width="145" height="85" rx="10" class="zero"/><text x="302.5" y="401" text-anchor="middle" class="empty">—</text><rect x="385" y="350" width="145" height="85" rx="10" class="green"/><text x="457.5" y="401" text-anchor="middle" class="value">2</text><rect x="540" y="350" width="145" height="85" rx="10" class="orange"/><text x="612.5" y="401" text-anchor="middle" class="value">1</text><rect x="695" y="350" width="145" height="85" rx="10" class="gray"/><text x="767.5" y="401" text-anchor="middle" class="value">1</text></g>
</svg>
