<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" role="img" aria-labelledby="title desc">
  <title id="title">2023—2026 年其他比赛获奖统计</title>
  <desc id="desc">智能车竞赛全国一等奖 1 项、省二等奖 2 项、省三等奖 4 项；嵌入式芯片与系统设计竞赛全国一等奖 1 项、全国二等奖 2 项、省一等奖 3 项；省机器人竞赛省二等奖 2 项、省三等奖 7 项；省人工智能竞赛省一等奖 1 项。</desc>
  <style>
    text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.name{font-size:23px;font-weight:700}.badge{font-size:18px;font-weight:700}.card{fill:#f8fafc;stroke:#d8dee8;stroke-width:1.5}.blue{fill:#e8f0ff;stroke:#4978c7;stroke-width:2}.green{fill:#e9f8ef;stroke:#3c8a5a;stroke-width:2}.purple{fill:#f3edff;stroke:#7855b5;stroke-width:2}.orange{fill:#fff3e3;stroke:#c97820;stroke-width:2}.gray{fill:#eef1f5;stroke:#7b879a;stroke-width:2}.divider{stroke:#d8dee8;stroke-width:1.5}
  </style>
  <rect width="920" height="620" fill="#ffffff"/>
  <text x="460" y="48" text-anchor="middle" class="title">2023—2026 年其他比赛获奖</text>
  <g><rect x="55" y="85" width="810" height="105" rx="14" class="card"/><text x="155" y="146" text-anchor="middle" class="name">智能车</text><path d="M250 105V170" class="divider"/><rect x="285" y="113" width="155" height="50" rx="10" class="blue"/><text x="362.5" y="144" text-anchor="middle" class="badge">国一等奖 × 1</text><rect x="470" y="113" width="155" height="50" rx="10" class="orange"/><text x="547.5" y="144" text-anchor="middle" class="badge">省二等奖 × 2</text><rect x="655" y="113" width="155" height="50" rx="10" class="gray"/><text x="732.5" y="144" text-anchor="middle" class="badge">省三等奖 × 4</text></g>
  <g><rect x="55" y="205" width="810" height="105" rx="14" class="card"/><text x="155" y="266" text-anchor="middle" class="name">嵌赛</text><path d="M250 225V290" class="divider"/><rect x="285" y="233" width="155" height="50" rx="10" class="blue"/><text x="362.5" y="264" text-anchor="middle" class="badge">国一等奖 × 1</text><rect x="470" y="233" width="155" height="50" rx="10" class="purple"/><text x="547.5" y="264" text-anchor="middle" class="badge">国二等奖 × 2</text><rect x="655" y="233" width="155" height="50" rx="10" class="green"/><text x="732.5" y="264" text-anchor="middle" class="badge">省一等奖 × 3</text></g>
  <g><rect x="55" y="325" width="810" height="105" rx="14" class="card"/><text x="155" y="386" text-anchor="middle" class="name">省机器人</text><path d="M250 345V410" class="divider"/><rect x="380" y="353" width="175" height="50" rx="10" class="orange"/><text x="467.5" y="384" text-anchor="middle" class="badge">省二等奖 × 2</text><rect x="585" y="353" width="175" height="50" rx="10" class="gray"/><text x="672.5" y="384" text-anchor="middle" class="badge">省三等奖 × 7</text></g>
  <g><rect x="55" y="445" width="810" height="105" rx="14" class="card"/><text x="155" y="506" text-anchor="middle" class="name">省人工智能</text><path d="M250 465V530" class="divider"/><rect x="482.5" y="473" width="175" height="50" rx="10" class="green"/><text x="570" y="504" text-anchor="middle" class="badge">省一等奖 × 1</text></g>
</svg>
