<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540">
  <style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.label{font-size:17px;font-weight:650}.small{font-size:14px}.branch{font-size:14px;font-weight:650}.process{fill:#f8fafc;stroke:#334155;stroke-width:2}.context{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.decision{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}.output{fill:#ecfdf5;stroke:#059669;stroke-width:2}.rejectBox{fill:#fef2f2;stroke:#dc2626;stroke-width:2}.line{stroke:#334155;stroke-width:2.5;fill:none}.accept{stroke:#059669;stroke-width:2.5;fill:none}.reject{stroke:#dc2626;stroke-width:2.5;fill:none}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#059669"/></marker><marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker></defs>
  <rect width="100%" height="100%" fill="white"/><text x="700" y="40" text-anchor="middle" class="title">无遮挡候选的最终选择</text>
  <rect x="55" y="84" width="310" height="82" rx="14" class="process"/><text x="210" y="116" text-anchor="middle" class="label">取画面最左、最右候选</text><text x="210" y="143" text-anchor="middle" class="small">中间候选不参与本轮选择</text>
  <rect x="470" y="84" width="340" height="82" rx="14" class="context"/><text x="640" y="116" text-anchor="middle" class="label">按上一目标边解释画面方向</text><text x="640" y="143" text-anchor="middle" class="small">使用车辆回转后的固定相机视野</text><path d="M365,125 L470,125" class="line" marker-end="url(#arrow)"/>
  <path d="M1050,67 L1180,125 L1050,183 L920,125 Z" class="decision"/><text x="1050" y="118" text-anchor="middle" class="label">候选到目标边之间</text><text x="1050" y="143" text-anchor="middle" class="label">还隔着另一个候选？</text><path d="M810,125 L920,125" class="line" marker-end="url(#arrow)"/>
  <rect x="1040" y="235" width="320" height="76" rx="14" class="rejectBox"/><text x="1200" y="265" text-anchor="middle" class="label">过滤被阻挡的候选</text><text x="1200" y="291" text-anchor="middle" class="small">网球与左右目标边切换时尤其重要</text><path d="M1125,158 L1125,210 L1200,210 L1200,235" class="reject" marker-end="url(#red)"/><text x="1148" y="196" class="branch" fill="#dc2626">是</text>
  <path d="M640,236 L755,292 L640,348 L525,292 Z" class="decision"/><text x="640" y="285" text-anchor="middle" class="label">有与上一轮相同</text><text x="640" y="310" text-anchor="middle" class="label">目标边的候选？</text><path d="M975,158 L975,205 L640,205 L640,236" class="accept" marker-end="url(#green)"/><text x="952" y="199" class="branch" fill="#059669">否</text>
  <rect x="105" y="420" width="380" height="82" rx="14" class="output"/><text x="295" y="452" text-anchor="middle" class="label">选择同目标边候选</text><text x="295" y="479" text-anchor="middle" class="small">复用车辆刚刚返回的无遮挡通道</text><path d="M525,292 L505,292 L505,461 L485,461" class="accept" marker-end="url(#green)"/><text x="486" y="277" class="branch" fill="#059669">有</text>
  <rect x="895" y="420" width="380" height="82" rx="14" class="output"/><text x="1085" y="452" text-anchor="middle" class="label">选择更靠画面边缘的候选</text><text x="1085" y="479" text-anchor="middle" class="small">没有同目标边候选时使用</text><path d="M755,292 L785,292 L785,461 L895,461" class="line" marker-end="url(#arrow)"/><text x="790" y="277" class="branch">没有</text>
</svg>
