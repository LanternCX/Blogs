<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
  <style>
    text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}
    .title{font-size:28px;font-weight:700}.label{font-size:19px;font-weight:650}.small{font-size:15px}.formula{font-size:18px;font-style:italic}
    .axis{stroke:#334155;stroke-width:2.2;fill:none}.truth{stroke:#4f46e5;stroke-width:4;fill:none}.sample{fill:#ea580c}.step{stroke:#ea580c;stroke-width:2.2;fill:#fff7ed;fill-opacity:.82}.fine{stroke:#059669;stroke-width:1.8;fill:#ecfdf5;fill-opacity:.72}
    .dash{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5}.note{fill:#f8fafc;stroke:#64748b;stroke-width:1.7}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="white"/>
  <text x="500" y="42" text-anchor="middle" class="title">采样率决定积分能看见多少角速度变化</text>
  <text x="500" y="73" text-anchor="middle" class="formula">转角 θ = ∫ω(t)dt　≈　Σ ω(k) · Δt</text>

  <g transform="translate(55 110)">
    <text x="205" y="0" text-anchor="middle" class="label">低采样率：大块矩形漏掉变化</text>
    <path d="M35,330 L430,330" class="axis" marker-end="url(#arrow)"/>
    <path d="M35,330 L35,35" class="axis" marker-end="url(#arrow)"/>
    <text x="438" y="337" class="small">t</text>
    <text x="17" y="28" class="formula">ω</text>

    <path d="M35,300 C80,298 105,275 135,205 C165,135 205,70 245,95 C280,117 287,245 326,255 C360,264 375,150 430,115" class="truth"/>
    <rect x="35" y="300" width="79" height="30" class="step"/>
    <rect x="114" y="248" width="79" height="82" class="step"/>
    <rect x="193" y="82" width="79" height="248" class="step"/>
    <rect x="272" y="249" width="79" height="81" class="step"/>
    <rect x="351" y="247" width="79" height="83" class="step"/>
    <g class="dash">
      <path d="M114,330 L114,248"/><path d="M193,330 L193,82"/><path d="M272,330 L272,249"/><path d="M351,330 L351,247"/>
    </g>
    <g class="sample">
      <circle cx="35" cy="300" r="5"/><circle cx="114" cy="248" r="5"/><circle cx="193" cy="82" r="5"/><circle cx="272" cy="249" r="5"/><circle cx="351" cy="247" r="5"/>
    </g>
    <text x="225" y="367" text-anchor="middle" class="small">采样间隔大，峰值和急转弯容易落在采样点之间</text>
  </g>

  <g transform="translate(515 110)">
    <text x="205" y="0" text-anchor="middle" class="label">高采样率：小块矩形贴近曲线</text>
    <path d="M35,330 L430,330" class="axis" marker-end="url(#arrow)"/>
    <path d="M35,330 L35,35" class="axis" marker-end="url(#arrow)"/>
    <text x="438" y="337" class="small">t</text>
    <text x="17" y="28" class="formula">ω</text>

    <path d="M35,300 C80,298 105,275 135,205 C165,135 205,70 245,95 C280,117 287,245 326,255 C360,264 375,150 430,115" class="truth"/>
    <path d="M35,300 H55 V297 H75 V290 H95 V275 H115 V246 H135 V205 H155 V160 H175 V120 H195 V91 H215 V79 H235 V88 H255 V108 H275 V165 H295 V229 H315 V252 H335 V257 H355 V250 H375 V214 H395 V166 H415 V128 H430 V330 H35 Z" class="fine"/>
    <g fill="#059669">
      <circle cx="35" cy="300" r="3.5"/><circle cx="55" cy="297" r="3.5"/><circle cx="75" cy="290" r="3.5"/><circle cx="95" cy="275" r="3.5"/><circle cx="115" cy="246" r="3.5"/><circle cx="135" cy="205" r="3.5"/><circle cx="155" cy="160" r="3.5"/><circle cx="175" cy="120" r="3.5"/><circle cx="195" cy="91" r="3.5"/><circle cx="215" cy="79" r="3.5"/><circle cx="235" cy="88" r="3.5"/><circle cx="255" cy="108" r="3.5"/><circle cx="275" cy="165" r="3.5"/><circle cx="295" cy="229" r="3.5"/><circle cx="315" cy="252" r="3.5"/><circle cx="335" cy="257" r="3.5"/><circle cx="355" cy="250" r="3.5"/><circle cx="375" cy="214" r="3.5"/><circle cx="395" cy="166" r="3.5"/><circle cx="415" cy="128" r="3.5"/>
    </g>
    <text x="225" y="367" text-anchor="middle" class="small">采样间隔小，矩形总面积更接近真实曲线下面积</text>
  </g>

  <path d="M90,505 L910,505" class="dash"/>
  <rect x="138" y="530" width="724" height="62" rx="12" class="note"/>
  <text x="500" y="556" text-anchor="middle" class="label">误差会逐次累加到航向角</text>
  <text x="500" y="580" text-anchor="middle" class="small">转速变化越快，低采样率漏掉的面积越多；匀速且 Δt 准确时，两者差别很小。</text>
</svg>
