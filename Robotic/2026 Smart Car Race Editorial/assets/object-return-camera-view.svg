<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420">
  <style>
    text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.label{font-size:17px;font-weight:650}.small{font-size:14px}.tiny{font-size:13px}.panel{fill:#f8fafc;stroke:#334155;stroke-width:2}.field{fill:#fff;stroke:#94a3b8;stroke-width:1.8}.fov{fill:#dbeafe;fill-opacity:.6;stroke:#2563eb;stroke-width:1.8}.car{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.line{stroke:#334155;stroke-width:2.5;fill:none}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
  <rect width="100%" height="100%" fill="white"/><text x="720" y="38" text-anchor="middle" class="title">搬运结束后的车头方向与相机视野</text>
  <g transform="translate(30 62)"><rect width="440" height="330" rx="14" class="panel"/><text x="220" y="31" text-anchor="middle" class="label">上一轮搬到 left 边（红 / 蓝）</text><rect x="65" y="57" width="310" height="205" class="field"/><text x="220" y="78" text-anchor="middle" class="tiny">top</text><text x="48" y="165" text-anchor="middle" class="tiny">left</text><text x="392" y="165" text-anchor="middle" class="tiny">right</text><path d="M94,160 L340,96 L340,224 Z" class="fov"/><rect x="72" y="143" width="43" height="34" rx="7" class="car"/><path d="M86,160 L113,160" class="line" marker-end="url(#arrow)"/><text x="220" y="287" text-anchor="middle" class="small">回转后车头朝 right</text><text x="220" y="311" text-anchor="middle" class="small">top 位于画面左侧</text></g>
  <g transform="translate(500 62)"><rect width="440" height="330" rx="14" class="panel"/><text x="220" y="31" text-anchor="middle" class="label">上一轮搬到 right 边（棕 / 白）</text><rect x="65" y="57" width="310" height="205" class="field"/><text x="220" y="78" text-anchor="middle" class="tiny">top</text><text x="48" y="165" text-anchor="middle" class="tiny">left</text><text x="392" y="165" text-anchor="middle" class="tiny">right</text><path d="M346,160 L100,96 L100,224 Z" class="fov"/><rect x="325" y="143" width="43" height="34" rx="7" class="car"/><path d="M353,160 L326,160" class="line" marker-end="url(#arrow)"/><text x="220" y="287" text-anchor="middle" class="small">回转后车头朝 left</text><text x="220" y="311" text-anchor="middle" class="small">top 位于画面右侧</text></g>
  <g transform="translate(970 62)"><rect width="440" height="330" rx="14" class="panel"/><text x="220" y="31" text-anchor="middle" class="label">上一轮搬到 top 边（网球）</text><rect x="65" y="57" width="310" height="205" class="field"/><text x="220" y="78" text-anchor="middle" class="tiny">top</text><text x="48" y="165" text-anchor="middle" class="tiny">left</text><text x="392" y="165" text-anchor="middle" class="tiny">right</text><path d="M220,98 L120,230 L320,230 Z" class="fov"/><rect x="199" y="78" width="43" height="34" rx="7" class="car"/><path d="M220,92 L220,120" class="line" marker-end="url(#arrow)"/><text x="220" y="287" text-anchor="middle" class="small">回转后车头朝 bottom</text><text x="220" y="311" text-anchor="middle" class="small">right 在画面左侧，left 在画面右侧</text></g>
</svg>
