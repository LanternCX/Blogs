<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520">
  <style>
    text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}
    .title{font-size:26px;font-weight:700}.label{font-size:17px;font-weight:650}.small{font-size:14px}.formula{font-size:16px;font-style:italic}
    .box{fill:#f8fafc;stroke:#334155;stroke-width:2}.feedforward{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}
    .feedback{fill:#ecfdf5;stroke:#059669;stroke-width:2}.plant{fill:#fff7ed;stroke:#ea580c;stroke-width:2}
    .line{stroke:#334155;stroke-width:2.4;fill:none}.feedback-line{stroke:#059669;stroke-width:2.4;fill:none}
    .dash{stroke-dasharray:8 6}.sum{fill:white;stroke:#334155;stroke-width:2.2}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <marker id="arrowFeedback" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#059669"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="white"/>
  <text x="560" y="44" text-anchor="middle" class="title">带前馈的电机速度闭环</text>

  <rect x="45" y="210" width="150" height="68" rx="12" class="box"/>
  <text x="120" y="238" text-anchor="middle" class="label">目标转速</text>
  <text x="120" y="262" text-anchor="middle" class="formula">ω*</text>

  <rect x="265" y="92" width="215" height="76" rx="12" class="feedforward"/>
  <text x="372" y="120" text-anchor="middle" class="label">电机模型前馈</text>
  <text x="372" y="146" text-anchor="middle" class="formula">Uff = (τω̇* + ω*) / K</text>

  <circle cx="265" cy="244" r="25" class="sum"/>
  <text x="265" y="252" text-anchor="middle" font-size="24">Σ</text>
  <text x="229" y="250" class="label">+</text>
  <text x="279" y="289" class="label">−</text>

  <rect x="325" y="210" width="155" height="68" rx="12" class="feedback"/>
  <text x="402" y="238" text-anchor="middle" class="label">PI 速度环</text>
  <text x="402" y="262" text-anchor="middle" class="small">反馈修正</text>

  <circle cx="555" cy="244" r="25" class="sum"/>
  <text x="555" y="252" text-anchor="middle" font-size="24">Σ</text>
  <text x="519" y="250" class="label">+</text>
  <text x="569" y="216" class="label">+</text>

  <rect x="625" y="210" width="155" height="68" rx="12" class="box"/>
  <text x="702" y="238" text-anchor="middle" class="label">PWM 驱动</text>
  <text x="702" y="262" text-anchor="middle" class="formula">Us</text>

  <rect x="840" y="210" width="190" height="68" rx="12" class="plant"/>
  <text x="935" y="238" text-anchor="middle" class="label">直流有刷电机</text>
  <text x="935" y="262" text-anchor="middle" class="small">负载工况</text>

  <rect x="535" y="360" width="180" height="68" rx="12" class="feedback"/>
  <text x="625" y="388" text-anchor="middle" class="label">编码器测速</text>
  <text x="625" y="412" text-anchor="middle" class="small">实际转速 ω</text>

  <path d="M195,244 L240,244" class="line" marker-end="url(#arrow)"/>
  <path d="M210,244 L210,130 L265,130" class="line" marker-end="url(#arrow)"/>
  <path d="M290,244 L325,244" class="line" marker-end="url(#arrow)"/>
  <path d="M480,244 L530,244" class="line" marker-end="url(#arrow)"/>
  <path d="M480,130 L555,130 L555,219" class="line" marker-end="url(#arrow)"/>
  <path d="M580,244 L625,244" class="line" marker-end="url(#arrow)"/>
  <path d="M780,244 L840,244" class="line" marker-end="url(#arrow)"/>
  <path d="M1030,244 L1070,244" class="line" marker-end="url(#arrow)"/>
  <text x="1060" y="224" text-anchor="middle" class="formula">ω</text>

  <path d="M1045,244 L1045,394 L715,394" class="feedback-line dash" marker-end="url(#arrowFeedback)"/>
  <path d="M535,394 L265,394 L265,269" class="feedback-line" marker-end="url(#arrowFeedback)"/>

  <text x="555" y="475" text-anchor="middle" class="small">前馈负责主要驱动量，PI 速度环补偿模型误差与负载扰动</text>
</svg>
