<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <style>
    text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}
    .title{font-size:26px;font-weight:700}.label{font-size:17px;font-weight:650}.small{font-size:14px}
    .input{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.filter{fill:#f8fafc;stroke:#334155;stroke-width:2}
    .regression{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}.output{fill:#ecfdf5;stroke:#059669;stroke-width:2}
    .line{stroke:#334155;stroke-width:2.4;fill:none}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="white"/>
  <text x="640" y="48" text-anchor="middle" class="title">编码器速度滤波流程</text>

  <rect x="35" y="112" width="170" height="78" rx="12" class="input"/>
  <text x="120" y="143" text-anchor="middle" class="label">编码器原始读数</text>
  <text x="120" y="169" text-anchor="middle" class="small">脉冲数</text>

  <rect x="255" y="112" width="170" height="78" rx="12" class="filter"/>
  <text x="340" y="143" text-anchor="middle" class="label">中值滤波</text>
  <text x="340" y="169" text-anchor="middle" class="small">去除离群尖刺</text>

  <rect x="475" y="112" width="170" height="78" rx="12" class="filter"/>
  <text x="560" y="143" text-anchor="middle" class="label">差分限幅</text>
  <text x="560" y="169" text-anchor="middle" class="small">限制异常突变</text>

  <rect x="695" y="112" width="190" height="78" rx="12" class="regression"/>
  <text x="790" y="143" text-anchor="middle" class="label">双窗口线性回归</text>
  <text x="790" y="169" text-anchor="middle" class="small">融合长短窗口估计</text>

  <rect x="935" y="112" width="150" height="78" rx="12" class="filter"/>
  <text x="1010" y="143" text-anchor="middle" class="label">低通滤波</text>
  <text x="1010" y="169" text-anchor="middle" class="small">平滑输出</text>

  <rect x="1135" y="112" width="110" height="78" rx="12" class="output"/>
  <text x="1190" y="143" text-anchor="middle" class="label">轮速</text>
  <text x="1190" y="169" text-anchor="middle" class="small">速度环反馈</text>

  <path d="M205,151 L255,151" class="line" marker-end="url(#arrow)"/>
  <path d="M425,151 L475,151" class="line" marker-end="url(#arrow)"/>
  <path d="M645,151 L695,151" class="line" marker-end="url(#arrow)"/>
  <path d="M885,151 L935,151" class="line" marker-end="url(#arrow)"/>
  <path d="M1085,151 L1135,151" class="line" marker-end="url(#arrow)"/>
</svg>
