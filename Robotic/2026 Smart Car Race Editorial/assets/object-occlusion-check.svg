<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.label{font-size:18px;font-weight:650}.small{font-size:14px}.panel{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.rule{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.decision{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}.line{stroke:#334155;stroke-width:2.5;fill:none}.guide{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 5}.object{stroke:#172033;stroke-width:1.5}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
  <rect width="100%" height="100%" fill="white"/><text x="600" y="40" text-anchor="middle" class="title">车载画面中的目标遮挡判断</text>
  <rect x="45" y="72" width="510" height="320" rx="14" class="panel"/><text x="300" y="104" text-anchor="middle" class="label">相机实际看到的画面</text><rect x="110" y="128" width="380" height="205" fill="white" stroke="#94a3b8" stroke-width="1.8"/><rect x="264" y="150" width="72" height="70" rx="6" fill="#bfdbfe" class="object"/><text x="300" y="190" text-anchor="middle" class="small">远处候选</text><rect x="236" y="218" width="128" height="88" rx="6" fill="#fed7aa" class="object"/><text x="300" y="267" text-anchor="middle" class="small">近处物体</text><path d="M300,150 L300,306" class="guide"/><text x="300" y="361" text-anchor="middle" class="small">画面底部更靠近车辆，顶部更远离车辆</text>
  <rect x="640" y="90" width="510" height="92" rx="14" class="rule"/><text x="895" y="122" text-anchor="middle" class="label">另一个物体更靠画面底部</text><text x="895" y="151" text-anchor="middle" class="small">覆盖候选中心 X，并与候选框下半部重叠</text><path d="M895,182 L895,225" class="line" marker-end="url(#arrow)"/><path d="M895,225 L1020,292 L895,359 L770,292 Z" class="decision"/><text x="895" y="286" text-anchor="middle" class="label">远处候选被挡住？</text><text x="895" y="314" text-anchor="middle" class="small">是：过滤　　否：保留</text>
</svg>
